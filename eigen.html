<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Releases - Thijs Jenster</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <h1 class="brand">thijs jenster</h1>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/nieuw.html">Nieuw</a>
        <a href="/eigen.html">Releases</a>
        <a href="/film.html">Film</a>
        <a href="/overig.html">Overig</a>
        <a href="/contact.html">Contact</a>

  <main class="container">
    <section class="hero">
      <div class="hero-left">
        <img id="hero-photo" src="assets/images/ThijsHeadshots-v1-4.jpg" alt="Thijs Jenster portrait">
      </div>
      <aside class="hero-right">
        <nav class="hero-nav">
          <a href="/nieuw.html">Nieuw</a>
          <a href="/eigen.html">Releases in Eigen Beheer</a>
          <a href="/film.html">Film</a>
          <a href="/overig.html">Overig</a>

      </aside>

      <h2>Releases in Eigen Beheer</h2>
      <div id="releases-list" class="cards">

          <h3>Voorbeeld Album</h3>
          <p>Een korte omschrijving van het project of album. Voeg hier het verhaal of credits toe.</p>
          <div class="bandcamp-embed">
            <iframe style="border: 0; width: 350px; height: 472px;" src="https://bandcamp.com/EmbeddedPlayer/album=0000000000/size=large/bgcol=ffffff/linkcol=000000/tracklist=true/artwork=small/transparent=true/" seamless>
              <a href="https://eigenbeheer.bandcamp.com">Bekijk op Bandcamp</a>
            </iframe>
          </div>
          <p><a href="https://eigenbeheer.bandcamp.com" target="_blank" rel="noopener">Open op Bandcamp</a></p>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <small>© <span id="year"></span> Thijs Jenster</small>
    </div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
