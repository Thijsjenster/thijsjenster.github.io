<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thijs Jenster</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <h1 class="brand">thijs jenster</h1>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-left">
        <img id="hero-photo" src="assets/images/ThijsHeadshots-v1-4.jpg" alt="Thijs Jenster portrait">
      </div>
      <aside class="hero-right">
        <nav class="hero-nav">
          <a href="#nieuw">Nieuw</a>
          <a href="#releases">Releases in Eigen Beheer</a>
          <a href="#film">Film</a>
          <a href="#overig">Overig</a>
          <a href="#contact">Contact</a>
        </nav>
      </aside>
    </section>

    <section id="nieuw" class="section">
      <h2>Nieuw</h2>
      <div id="nieuw-list" class="list"></div>
    </section>

    <section id="releases" class="section">
      <h2>Releases in Eigen Beheer</h2>
      <div id="releases-list" class="cards"></div>
    </section>

    <section id="film" class="section">
      <h2>Film</h2>
      <div id="film-list" class="cards"></div>
    </section>

    <section id="overig" class="section">
      <h2>Overig</h2>
      <div id="overig-list" class="cards"></div>
    </section>

    <section id="contact" class="section contact">
      <h2>Contact</h2>
      <div id="contact-info">
        <p>Email: <a href="mailto:Thijsjenster.music@outlook.com">Thijsjenster.music@outlook.com</a></p>
        <p>Bandcamp: <a href="https://eigenbeheer.bandcamp.com" target="_blank" rel="noopener">eigenbeheer.bandcamp.com</a></p>
        <p>Instagram: <a href="https://www.instagram.com/eigenbeheer/" target="_blank" rel="noopener">@eigenbeheer</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <small>© <span id="year"></span> Thijs Jenster</small>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
